experiment:
  name: ccpp_gemma2_9b_it_wildjailbreak
  phase: 1
  description: CC++ data contract for Gemma 2 9B IT on WildJailbreak.

model:
  id: google/gemma-2-9b-it
  revision: null

tokenizer:
  id: google/gemma-2-9b-it
  revision: null

dataset:
  id: allenai/wildjailbreak
  revision: 5ddc12a7894f842b0619b8e1c7ee496b198af009
  name: train
  split: train
  loader_kwargs:
    delimiter: "\t"
    keep_default_na: false
  required_data_types:
    - vanilla_harmful
    - vanilla_benign
    - adversarial_harmful
    - adversarial_benign
  prompt_columns:
    vanilla: vanilla
    adversarial: adversarial
  completion_column: completion
  tactics_column: tactics
  data_type_column: data_type

sampling:
  seed: 59841
  per_data_type:
    vanilla_harmful: 2000
    vanilla_benign: 2000
    adversarial_harmful: 2000
    adversarial_benign: 2000

splits:
  vanilla:
    train: 0.70
    val: 0.15
    test: 0.15
  adversarial_split: transfer

generation:
  seed: 59841
  params:
    max_new_tokens: 256
    do_sample: false
  runtime:
    backend: transformers
    device_map: auto
    torch_dtype: auto

response_cache:
  debug_subset:
    enabled: true
    limit: 16
    splits:
      - train
      - val
      - test
      - transfer

activation:
  seed: 59841
  mode: prompt_final
  source: residual
  layer: 31
  token_position: final_prompt_token
  aggregation:
    rule: none
  segment:
    enabled: false
  mock:
    hidden_size: 8

text_baseline:
  name: tfidf_logistic_regression
  seed: 59841
  threshold:
    rule: maximize_tpr_under_fpr
    max_fpr: 0.01
    selection_split: val
    selection_family: vanilla
  tfidf:
    lowercase: true
    ngram_range: [1, 2]
    min_df: 1
    max_df: 1.0
    max_features: null
    sublinear_tf: true
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: liblinear
    class_weight: null

dense_probe:
  name: dense_prompt_final_logistic_regression
  seed: 59841
  feature_source: activation_cache
  threshold:
    rule: maximize_tpr_under_fpr
    max_fpr: 0.01
    selection_split: val
    selection_family: vanilla
  logistic_regression:
    C: 1.0
    max_iter: 1000
    solver: liblinear
    class_weight: null

outputs:
  data_path: data/processed/ccpp/wildjailbreak_gemma2_9b_it.jsonl
  metadata_path: data/processed/ccpp/wildjailbreak_gemma2_9b_it.metadata.json
  response_cache_path: artifacts/ccpp/responses/gemma2_9b_it.responses.jsonl
  response_cache_metadata_path: artifacts/ccpp/responses/gemma2_9b_it.metadata.json
  activation_cache_path: artifacts/ccpp/activations/gemma2_9b_it.prompt_final.residual.layer31.npz
  activation_index_path: artifacts/ccpp/activations/gemma2_9b_it.prompt_final.residual.layer31.index.jsonl
  activation_metadata_path: artifacts/ccpp/activations/gemma2_9b_it.prompt_final.residual.layer31.metadata.json
  text_baseline_model_path: artifacts/ccpp/baselines/tfidf_logreg.joblib
  text_baseline_scores_path: results/ccpp/tfidf_logreg.scores.jsonl
  text_baseline_metrics_path: results/ccpp/tfidf_logreg.metrics.json
  text_baseline_table_path: results/ccpp/tfidf_logreg.table.csv
  dense_probe_model_path: artifacts/ccpp/probes/dense_prompt_final_logreg.joblib
  dense_probe_scores_path: results/ccpp/dense_prompt_final_logreg.scores.jsonl
  dense_probe_metrics_path: results/ccpp/dense_prompt_final_logreg.metrics.json
  dense_probe_table_path: results/ccpp/dense_prompt_final_logreg.table.csv
